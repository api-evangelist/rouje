name: Rouje
description: >-
  Rouje is a Parisian ready-to-wear and beauty brand founded by Jeanne Damas, selling
  feminine ready-to-wear, shoes, accessories, and the "Les Filles en Rouje" makeup and
  skincare line direct-to-consumer online and through boutiques across France. Rouje has
  no first-party developer API, but its Shopify-hosted storefront exposes a native
  agent-commerce surface: a Universal Commerce Protocol (UCP) MCP endpoint for
  agent-driven shopping and checkout, a published llms.txt / agents.md with explicit
  agent instructions, Shopify Customer Account API OpenID Connect discovery, and public
  read-only product/collection JSON endpoints. Surfaced as a portfolio company of Partech.
